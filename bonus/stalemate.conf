{
  "name": "stalemate",
  "description": "Bonus: 512 > 256 with a 6th output, Stalemate, trained on the 4 symmetric versions of every training board (bonus/README.md)",
  "input_size": 773,
  "layers": [
    {"size": 512, "activation": "relu", "dropout": 0.3},
    {"size": 256, "activation": "relu", "dropout": 0.3},
    {"size": 6, "activation": "softmax"}
  ],
  "init": "auto",
  "loss": "cross_entropy",
  "dtype": "float32",
  "optimizer": {"name": "adam", "lr": 0.001},
  "lr_schedule": {"name": "plateau", "factor": 0.5, "patience": 2},
  "training": {
    "epochs": 50,
    "batch_size": 256,
    "l2": 0.0001,
    "grad_clip": 5.0,
    "early_stopping": {"patience": 5, "min_delta": 0.0001}
  },
  "labels": ["Nothing", "Check White", "Check Black", "Checkmate White", "Checkmate Black", "Stalemate"],
  "seed": 42
}
