{
  "name": "large",
  "description": "Delivered network: 1024 > 512, trained on the 4 symmetric versions of every training board (scripts/train.py --flip-colors --flip-files), early stopping",
  "input_size": 773,
  "layers": [
    {"size": 1024, "activation": "relu", "dropout": 0.3},
    {"size": 512, "activation": "relu", "dropout": 0.3},
    {"size": 5, "activation": "softmax"}
  ],
  "init": "auto",
  "loss": "cross_entropy",
  "dtype": "float32",
  "optimizer": {"name": "adam", "lr": 0.001},
  "lr_schedule": {"name": "plateau", "factor": 0.5, "patience": 2},
  "training": {
    "epochs": 80,
    "batch_size": 256,
    "l2": 0.0001,
    "grad_clip": 5.0,
    "early_stopping": {"patience": 6, "min_delta": 0.0001}
  },
  "labels": ["Nothing", "Check White", "Check Black", "Checkmate White", "Checkmate Black"],
  "seed": 42
}
