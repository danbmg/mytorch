{
  "name": "final",
  "description": "Delivered network: 2 hidden layers 512 > 256 (best on the whole training set, docs/benchmarks.md §3), lr halved when val_loss stalls (plateau, best schedule, docs/benchmarks.md §2)",
  "input_size": 773,
  "layers": [
    {"size": 512, "activation": "relu", "dropout": 0.3},
    {"size": 256, "activation": "relu", "dropout": 0.3},
    {"size": 5, "activation": "softmax"}
  ],
  "init": "auto",
  "loss": "cross_entropy",
  "dtype": "float32",
  "optimizer": {"name": "adam", "lr": 0.001},
  "lr_schedule": {"name": "plateau", "factor": 0.5, "patience": 2},
  "training": {
    "epochs": 50,
    "batch_size": 256,
    "l2": 0.0001,
    "grad_clip": 5.0,
    "early_stopping": {"patience": 5, "min_delta": 0.0001}
  },
  "labels": ["Nothing", "Check White", "Check Black", "Checkmate White", "Checkmate Black"],
  "seed": 42
}
