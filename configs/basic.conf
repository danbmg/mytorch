{
  "name": "basic",
  "description": "Baseline: 773 one-hot board features -> 2 ReLU hidden layers -> 5 classes",
  "input_size": 773,
  "layers": [
    {"size": 256, "activation": "relu", "dropout": 0.2},
    {"size": 128, "activation": "relu", "dropout": 0.2},
    {"size": 5, "activation": "softmax"}
  ],
  "init": "auto",
  "loss": "cross_entropy",
  "dtype": "float32",
  "optimizer": {"name": "adam", "lr": 0.001},
  "lr_schedule": {"name": "exponential", "gamma": 0.95},
  "training": {
    "epochs": 30,
    "batch_size": 256,
    "l2": 0.0001,
    "grad_clip": 5.0,
    "early_stopping": {"patience": 5, "min_delta": 0.0001}
  },
  "labels": ["Nothing", "Check White", "Check Black", "Checkmate White", "Checkmate Black"],
  "seed": 42
}
